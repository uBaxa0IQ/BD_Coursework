version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nba_postgres
    environment:
      POSTGRES_DB: nba_stats
      POSTGRES_USER: nba_admin
      POSTGRES_PASSWORD: nba_secure_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba_admin -d nba_stats"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nba_redis
    # Порт 6379 на хосте не пробрасываем: в Windows он часто в excluded range 6306–6405.
    # Backend ходит в redis:6379 по внутренней сети compose.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: nba_backend
    # Порт 8000 на хосте не пробрасываем: в Windows он часто в excluded range 7999–8098.
    # Backend внутри compose слушает 8000; с хоста — http://localhost:8888
    ports:
      - "8888:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nba_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8888
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
