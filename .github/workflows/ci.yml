name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nba_stats
          POSTGRES_USER: nba_admin
          POSTGRES_PASSWORD: nba_secure_pass_2024
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nba_admin -d nba_stats"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: nba_secure_pass_2024
      DATABASE_URL: postgresql+asyncpg://nba_admin:nba_secure_pass_2024@localhost:5432/nba_stats
      TEST_DATABASE_URL: postgresql+asyncpg://nba_admin:nba_secure_pass_2024@localhost:5432/nba_stats
      TEST_READER_DATABASE_URL: postgresql://nba_reader_user:reader_pass_2024@localhost:5432/nba_stats
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: code/backend/requirements.txt
      - run: pip install -r code/backend/requirements.txt
      - name: Initialize schema
        run: |
          for script in code/db/[0-9][0-9]_*.sql; do
            psql -h localhost -U nba_admin -d nba_stats -v ON_ERROR_STOP=1 -f "$script"
          done
      - name: Import demo snapshot
        run: python code/backend/scripts/import_db.py --in csv_2021-2026
      - name: Test API and PostgreSQL functions
        working-directory: code/backend
        run: python -m pytest tests -q
